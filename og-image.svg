<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f9f5f1"/>
      <stop offset="100%" style="stop-color:#f5f0e8"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c6a66a"/>
      <stop offset="100%" style="stop-color:#b8955a"/>
    </linearGradient>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#122c45"/>
      <stop offset="100%" style="stop-color:#1c3f60"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#c6a66a" flood-opacity="0.35"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#122c45" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Subtle pattern lines -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#122c45" stroke-width="1"/>
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#122c45" stroke-width="1"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="url(#goldGradient)"/>

  <!-- Main content container -->
  <g transform="translate(120, 140)">
    <!-- Logo mark -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#goldGradient)"/>
      <rect x="10" y="10" width="100" height="100" rx="22" fill="#fdfaf3"/>
      <!-- Placeholder icon - balanced scales -->
      <g transform="translate(60, 60)">
        <path d="M0,-35 L-25,-5 L25,-5 Z" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-25,-5 L-30,25" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
        <path d="M25,-5 L30,25" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
        <path d="M-15,15 L15,15" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Text content -->
    <g transform="translate(150, 10)">
      <text x="0" y="55" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#122c45" letter-spacing="-1.5" filter="url(#textShadow)">Almerinda Novaes</text>
      <text x="0" y="115" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#5f6977" letter-spacing="0.5">Advocacia Previdenciária</text>

      <!-- Divider -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="80" height="4" rx="2" fill="url(#goldGradient)"/>
        <rect x="95" y="0" width="280" height="1" fill="#efe5d7"/>
      </g>

      <!-- Stats -->
      <g transform="translate(0, 170)" font-family="Inter, system-ui, sans-serif">
        <g>
          <text x="0" y="0" font-size="36" font-weight="800" fill="#122c45">15+</text>
          <text x="0" y="35" font-size="16" font-weight="500" fill="#5f6977">Anos de experiência</text>
        </g>
        <g transform="translate(220, 0)">
          <text x="0" y="0" font-size="36" font-weight="800" fill="#122c45">1.800+</text>
          <text x="0" y="35" font-size="16" font-weight="500" fill="#5f6977">Casos atendidos</text>
        </g>
        <g transform="translate(460, 0)">
          <text x="0" y="0" font-size="36" font-weight="800" fill="#122c45">95%</text>
          <text x="0" y="35" font-size="16" font-weight="500" fill="#5f6977">Satisfação</text>
        </g>
      </g>

      <!-- CTA -->
      <g transform="translate(0, 260)">
        <rect x="0" y="0" width="320" height="56" rx="28" fill="url(#primaryGradient)" filter="url(#shadow)"/>
        <text x="160" y="38" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">Agendar consultoria</text>
      </g>
    </g>
  </g>

  <!-- Bottom WhatsApp hint -->
  <g transform="translate(120, 550)" font-family="Inter, system-ui, sans-serif" opacity="0.7">
    <circle cx="20" cy="10" r="10" fill="#1bba5f"/>
    <text x="45" y="14" font-size="14" font-weight="600" fill="#122c45">WhatsApp: (11) 98066-5063</text>
  </g>

  <!-- Right decorative element -->
  <g transform="translate(1050, 480)" opacity="0.15">
    <circle cx="0" cy="0" r="180" fill="url(#goldGradient)"/>
  </g>
</svg>